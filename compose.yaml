services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      COOKIE_SECURE: "true"
      REFLEX_API_URL: https://${APP_DOMAIN:?Configure APP_DOMAIN}
      REFLEX_DEPLOY_URL: https://${APP_DOMAIN:?Configure APP_DOMAIN}
      GRANIAN_WORKERS: "1"
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
